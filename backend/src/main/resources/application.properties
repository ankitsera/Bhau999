spring.application.name=backend
spring.datasource.url=jdbc:mysql://localhost:3306/matka_user_db
spring.datasource.username=papa
spring.datasource.password=papa@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Payment gateway configuration - read API key from environment variable PRIMEXPAY_API_KEY_SARA1234
# Example (Windows PowerShell):
#   setx PRIMEXPAY_API_KEY_SARA1234 "your_api_key_here"
# or for current session only:
#   $env:PRIMEXPAY_API_KEY_SARA1234 = "your_api_key_here"
payment.gateway.apikey=${PRIMEXPAY_API_KEY_SARA1234:}
# Optional: override auth email via env var PRIMEXPAY_AUTH_EMAIL
payment.gateway.authEmail=${PRIMEXPAY_AUTH_EMAIL:sara1234@gmail.com}